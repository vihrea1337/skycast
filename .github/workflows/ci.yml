name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis, lint, unit tests, build
        # `test` (а не testDebugUnitTest): покрывает и Android-, и чистые JVM-модули
        run: ./gradlew detekt lint test assembleDebug --stacktrace

      - name: Upload reports on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: '**/build/reports/**'
